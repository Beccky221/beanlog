<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>咖啡实验室</title>
    <meta name="description" content="我的咖啡收藏与饮用档案" />
    <!-- 添加到主屏幕后全屏运行，像小程序一样 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="咖啡实验室" />
    <meta name="theme-color" content="#F2F0E4" />
    <!-- 用相对路径：部署在 GitHub Pages 子路径（/beanlog/）下也能找到 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-handpaint-v2.png" />
    <link rel="icon" type="image/png" href="./apple-touch-icon-handpaint-v2.png" />
    <link rel="manifest" href="./manifest-handpaint-v2.webmanifest" />
    <script>
      // 首屏就把主题贴上，避免从默认主题闪一下再切换
      try {
        var t = localStorage.getItem('beanlog.theme.v1')
        document.documentElement.dataset.theme = ['jade','blue','purple','pink','white','gray'].includes(t) ? t : 'jade'
      } catch (e) {
        document.documentElement.dataset.theme = 'jade'
      }
      var launchColors = {jade:'#F2F0E4',blue:'#EDF3F6',purple:'#F2EDF5',pink:'#FAEFF0',white:'#F5F3ED',gray:'#EFF0EE'};
      var launchColor = launchColors[document.documentElement.dataset.theme] || launchColors.jade;
      document.documentElement.style.backgroundColor = launchColor;
      document.querySelector('meta[name="theme-color"]').content = launchColor;
    </script>
    <style>html,body,#root{min-height:100%;margin:0}body{background:inherit}.beanlog-first-frame{height:100dvh;display:flex;align-items:center;justify-content:center;background:inherit}.beanlog-first-frame img{background:transparent}</style>
    <script type="module" crossorigin src="./assets/index-CjM04ROH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BlkduAhI.css">
  </head>
  <body>
    <div id="root"><div class="beanlog-first-frame"><img src="./assets/icon-LtTNrjDy.png" width="120" height="120" alt="咖啡实验室" /></div></div>
  </body>
</html>
